  <!-- QUIZ -->
  <section id="quiz">
    <p class="lead">{{QUIZ_LEAD}}</p>
    <div class="qpart" id="partA"><div class="sec-head"><span class="tag water">A</span><h2 id="hA">Booklet A</h2><span class="qmarks" id="infoA"></span></div><div id="mcq" class="qpart"></div></div>
    <div class="qpart" id="partB"><div class="sec-head"><span class="tag food">B</span><h2 id="hB">Booklet B</h2><span class="qmarks" id="infoB"></span></div><div id="oeq" class="qpart"></div></div>
    <div class="score" id="scorebox" hidden>
      <span class="eyebrow">Your score</span>
      <div class="num" id="scorenum">0 / 100</div>
      <div class="track"><div class="fill" id="scorefill"></div></div>
      <div class="breakdown" id="breakdown"></div>
      <p id="scoremsg"></p>
      <div id="revise"></div>
    </div>
    <div class="actions">
      <button class="btn" id="submit" type="button">Mark my paper</button>
      <button class="btn ghost" id="reset" type="button">Try again</button>
      <span class="blank-note" id="blanknote"></span>
    </div>
  </section>
